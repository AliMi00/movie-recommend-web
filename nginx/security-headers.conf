# Security headers, kept in a snippet because nginx's add_header does not
# merge across levels: a location block that sets any add_header of its own
# discards every add_header inherited from the server block. Each location
# therefore includes this file explicitly rather than relying on inheritance.
#
# __CSP_CONNECT_SRC__ is replaced at container start by docker-entrypoint.sh
# with the API origin actually in use, so the policy tracks the deployment.
add_header X-Frame-Options SAMEORIGIN always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://image.tmdb.org; font-src 'self' data:; connect-src 'self' __CSP_CONNECT_SRC__; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
