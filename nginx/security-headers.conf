# Security headers, kept in a snippet because nginx's add_header does not
# merge across levels: a location block that sets any add_header of its own
# discards every add_header inherited from the server block. Each location
# therefore includes this file explicitly rather than relying on inheritance.
#
# __CSP_CONNECT_SRC__ is replaced at container start by docker-entrypoint.sh
# with the API origin actually in use, so the policy tracks the deployment.
add_header X-Frame-Options SAMEORIGIN always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# Two Flutter-on-CanvasKit quirks drive the connect-src list below, and both
# fail hard rather than degrading if you get them wrong:
#
#   fonts.gstatic.com — CanvasKit pulls Roboto and the Noto fallback faces
#     (which supply the emoji in the mood chips) at runtime via fetch(), so
#     connect-src governs them, not just font-src. Block it and every glyph
#     in the app disappears: the UI renders completely textless. Bundling
#     Roboto locally would fix Latin text but still leave emoji as tofu.
#
#   image.tmdb.org — cached_network_image fetches artwork with XHR and draws
#     it into the canvas, so it too is subject to connect-src, not img-src.
#     Listing it only under img-src silently yields blank posters.
#
# Everything else stays same-origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://image.tmdb.org; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://fonts.gstatic.com https://image.tmdb.org __CSP_CONNECT_SRC__; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
