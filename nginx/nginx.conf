worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide the nginx version from responses and error pages.
    server_tokens off;

    # Writable-by-nginx temp paths, so the container can run as a non-root
    # user with a read-only-ish filesystem.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # JSON access log: request_time/upstream metrics are what a log-based
    # scraper or Loki would key off, and JSON avoids brittle regex parsing.
    log_format json_combined escape=json
      '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent"'
      '}';
    access_log /dev/stdout json_combined;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # ---- Public site ----
    server {
        # 8080 rather than 80: ports below 1024 need root, and this
        # container runs as the unprivileged nginx user.
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Liveness/readiness probe. Served locally with no dependency on
        # the API, so it answers "is this container serving?" and nothing
        # more — an API outage must not mark the web tier unhealthy.
        location = /healthz {
            access_log off;
            add_header Content-Type application/json always;
            return 200 '{"status":"ok"}';
        }

        # Entry-point files carry no content hash, so they must never be
        # cached — otherwise a browser keeps serving the previous release.
        location ~* ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|main\.dart\.js|manifest\.json|version\.json)$ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        # The asset bundle and CanvasKit are NOT fingerprinted: their paths stay
        # identical across builds while their contents change. The icon font is
        # the sharp edge — Flutter tree-shakes MaterialIcons down to just the
        # glyphs the app uses (it ships at ~20KB, not ~1MB), so adding one new
        # icon rewrites the file at the same URL. Served as `immutable`, a
        # returning visitor is by definition never going to revalidate it, and
        # every newly added icon renders as a blank square against their
        # year-old copy. Observed exactly that: qr_code, devices and
        # mark_email_read came up empty in the new intro while icons that
        # already existed elsewhere in the app rendered fine.
        #
        # `no-cache` still stores the file — it just forces revalidation, which
        # the etag answers with a 304, so this costs a conditional request
        # rather than a re-download.
        location ~* ^/(assets|canvaskit)/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        # Hashed build output can be cached hard. Note this deliberately sits
        # *after* the block above: nginx evaluates regex locations in order, so
        # /assets/... must be claimed first or it falls in here by extension.
        location ~* \.(js|css|wasm|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|otf|json|symbols)$ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # SPA fallback: GoRouter owns client-side routing, so any unknown
        # path must return index.html rather than a 404. Deep links land
        # here, so it must send the no-cache headers index.html needs.
        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            try_files $uri $uri/ /index.html;
        }
    }

    # ---- Metrics (internal only) ----
    # Bound to a separate port so it is never exposed through Traefik;
    # only the Prometheus exporter sidecar on the container network
    # reaches it.
    server {
        listen 9113;
        server_name _;
        access_log off;

        location = /stub_status {
            stub_status;
        }
    }
}
