<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <!-- Runtime config injected by entrypoint.sh at container startup. Any
       placeholder left un-substituted (no value supplied to the container)
       stays as '__NAME__' and is treated as "not configured" below. -->
  <script>
    window.CINEJO_API_BASE_URL = '__CINEJO_API_BASE_URL__';
    window.CINEJO_DEMO_EMAIL = '__CINEJO_DEMO_EMAIL__';
    window.CINEJO_DEMO_PASSWORD = '__CINEJO_DEMO_PASSWORD__';
    // Read by BOTH the posthog-js snippet below and the Dart SDK (via JS
    // interop in web_config_real.dart), so one injected value configures
    // both. Previously the Dart side read a compile-time --dart-define that
    // the Docker build never set, so every explicit event was dropped.
    window.POSTHOG_API_KEY = '__POSTHOG_API_KEY__';
    window.POSTHOG_HOST = '__POSTHOG_API_HOST__';
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Cinreco - a movie recommendation web app. Swipe-based movie discovery built with Flutter Web.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Cinreco">

</head>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
