name: cinejo_frontend
description: "CineJo Web - a movie recommendation web app (Flutter Web client for the CineJo API)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Navigation
  go_router: ^14.2.7
  
  # HTTP & Networking
  http: ^1.2.2
  dio: ^5.4.0
  
  # Image Caching & Loading
  cached_network_image: ^3.3.1
  
  # Local Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.2

  # JSON Serialization
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1

  # Animations & Gestures
  flutter_animate: ^4.5.0
  flutter_card_swiper: ^7.0.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.2.1
  device_preview: ^1.2.0
  posthog_flutter: ^5.25.1
  flutter_markdown: ^0.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  
  # Code Generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  freezed: ^2.4.6

  # App icon generation (build-time only; run with
  # `dart run flutter_launcher_icons` after editing assets/icon/*)
  flutter_launcher_icons: ^0.14.1

# Launcher icon sources live in assets/icon/ and are inputs to the generator
# rather than runtime assets, so they are deliberately not declared under
# flutter/assets — bundling them would just add weight to the app.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  # Android adaptive icons take separate layers; the system masks the
  # foreground to whatever shape the launcher uses, so the mark is kept well
  # inside the guaranteed-visible centre.
  android: "ic_launcher"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  ios: true
  # iOS rejects icons with an alpha channel at App Store submission.
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#eaf1fc"
    theme_color: "#1d4ed8"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/mock_data/
    - assets/legal/
