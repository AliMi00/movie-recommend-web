apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # Fixed uid so the committed dashboard JSON can reference this
    # datasource by name rather than by a uid Grafana generates at runtime
    # (which would differ on every fresh install and leave every panel
    # pointing at nothing).
    uid: cinejo-prometheus
    url: http://cinejo-prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Matches prometheus.yml's scrape_interval, so Grafana picks sensible
      # default step sizes rather than over-sampling.
      timeInterval: 15s
