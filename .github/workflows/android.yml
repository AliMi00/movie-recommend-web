name: Android

# Produces installable Android artifacts:
#   - APK  — a single file you can send to someone to sideload.
#   - AAB  — the Android App Bundle format Google Play requires for upload.
#
# Unlike the web build, Android cannot inject configuration at runtime: the
# web image ships placeholders in index.html that the container entrypoint
# rewrites at startup, but an APK is a signed archive that must be correct at
# compile time. So the API URL and demo credentials are baked in here with
# --dart-define, sourced from repository variables/secrets rather than
# hardcoded.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_aab:
        description: "Also build an AAB (Play Store bundle)"
        type: boolean
        default: true

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.32.8"
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed only by the release step on tag pushes
    steps:
      - uses: actions/checkout@v4

      # Android Gradle Plugin 8.7 requires JDK 17; the runner's default JDK
      # has changed before, so it is pinned rather than assumed.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      # Decodes the upload keystore from a secret, if one is configured.
      # Without it the build still succeeds — Gradle falls back to debug
      # signing (see android/app/build.gradle.kts) — which produces an APK
      # that installs fine for testing but is NOT accepted by Play Store.
      # This keeps the workflow green for forks and before a key exists.
      - name: Configure signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set — building with debug signing. The APK is installable for testing but the AAB cannot be uploaded to Play Store."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "release signing configured"

      # Play Store rejects an upload whose versionCode it has seen before, so
      # the run number is used as a monotonically increasing build number.
      # versionName comes from the tag when tagged, otherwise from pubspec.
      - name: Resolve version
        id: version
        run: |
          pubspec_version=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="$pubspec_version"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "versionName=$name versionCode=${{ github.run_number }}"

      - name: Build APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          DEMO_EMAIL: ${{ secrets.DEMO_EMAIL }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}" \
            --dart-define=CINRECO_API_BASE_URL="${API_BASE_URL:-https://api.gozaga.xyz/v1}" \
            --dart-define=CINRECO_DEMO_EMAIL="${DEMO_EMAIL}" \
            --dart-define=CINRECO_DEMO_PASSWORD="${DEMO_PASSWORD}" \
            --dart-define=POSTHOG_API_KEY="${POSTHOG_API_KEY}" \
            --dart-define=POSTHOG_HOST="${POSTHOG_HOST:-https://eu.i.posthog.com}"

      - name: Build AAB
        if: github.event_name != 'workflow_dispatch' || inputs.build_aab
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          DEMO_EMAIL: ${{ secrets.DEMO_EMAIL }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        run: |
          flutter build appbundle --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}" \
            --dart-define=CINRECO_API_BASE_URL="${API_BASE_URL:-https://api.gozaga.xyz/v1}" \
            --dart-define=CINRECO_DEMO_EMAIL="${DEMO_EMAIL}" \
            --dart-define=CINRECO_DEMO_PASSWORD="${DEMO_PASSWORD}" \
            --dart-define=POSTHOG_API_KEY="${POSTHOG_API_KEY}" \
            --dart-define=POSTHOG_HOST="${POSTHOG_HOST:-https://eu.i.posthog.com}"

      # Give the files versioned names so a downloaded artifact is
      # identifiable months later rather than being another "app-release.apk".
      - name: Rename artifacts
        run: |
          mkdir -p dist
          v="${{ steps.version.outputs.name }}+${{ steps.version.outputs.code }}"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/cinreco-${v}.apk"
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab "dist/cinreco-${v}.aab"
          fi
          ls -lh dist/

      # Verify the APK is actually a valid, installable archive rather than
      # trusting that a green Gradle run means a working app. aapt2 reads the
      # manifest back out of the built file, which catches a corrupt or
      # mis-signed archive that still "built successfully".
      - name: Verify APK
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          echo "using $AAPT"
          "$AAPT" dump badging dist/*.apk | grep -E "^package|^application-label|^sdkVersion|^targetSdkVersion"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: dist/*
          retention-days: 90
          if-no-files-found: error

      # Only tagged pushes create a public Release. Ordinary pushes to main
      # still leave a downloadable artifact on the run itself.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Android build `${{ steps.version.outputs.name }}` (versionCode ${{ steps.version.outputs.code }}).

            - **APK** — download and sideload directly on a device.
            - **AAB** — upload to the Google Play Console.

            Release signing: `${{ steps.signing.outputs.signed == 'true' && 'enabled' || 'DEBUG KEYS (not Play-uploadable)' }}`
