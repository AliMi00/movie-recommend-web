name: Deploy

# Publishes the image to GHCR and rolls it out to the homelab. Split from
# ci.yml so that shipping is gated on a green build: this only starts after
# CI has completed successfully on main.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  # Manual re-run, and the path for rolling back by deploying an older SHA.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to the current commit SHA)"
        required: false
        type: string

# Never let two deploys race for the same host.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TERRAFORM_VERSION: "1.9.8"

jobs:
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    # workflow_run fires on failure too, so the CI conclusion must be checked
    # explicitly or a red build would still deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Provided automatically by Actions; no PAT to rotate or leak.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image references must be lowercase; repository names may not be.
      - name: Resolve image reference
        id: meta
        run: |
          repo=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          tag="${{ inputs.image_tag }}"
          if [ -z "$tag" ]; then tag="${GITHUB_SHA::12}"; fi
          echo "repo=$repo"        >> "$GITHUB_OUTPUT"
          echo "tag=$tag"          >> "$GITHUB_OUTPUT"
          echo "image=$repo:$tag"  >> "$GITHUB_OUTPUT"

      # Tagged with the commit SHA as well as :latest. The SHA tag is what
      # Terraform deploys, so every release is traceable to a commit and a
      # rollback is just re-running this workflow with an older tag.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to homelab
    runs-on: ubuntu-latest
    needs: publish
    # Bind to a GitHub Environment so the deploy secrets are scoped to it and
    # a required reviewer can be added later without touching this file.
    environment: production
    steps:
      - uses: actions/checkout@v4

      # The runner reaches the homelab over Tailscale; the host has no
      # public SSH port. The OAuth client is scoped to an ephemeral,
      # tagged node that is removed when the job ends.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pin the host key rather than disabling verification, so a
          # man-in-the-middle on the tailnet cannot silently intercept.
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host home-server
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      # Terraform reads the image from the daemon rather than pulling it
      # itself, which keeps registry credentials out of Terraform state.
      - name: Pull image on the target host
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | ssh home-server "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh home-server "docker pull ${{ needs.publish.outputs.image }}"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_docker_host: "ssh://home-server"
          TF_VAR_app_image: ${{ needs.publish.outputs.image }}
          TF_VAR_public_domain: ${{ vars.PUBLIC_DOMAIN }}
          TF_VAR_api_base_url: ${{ vars.API_BASE_URL }}
          TF_VAR_demo_email: ${{ secrets.DEMO_EMAIL }}
          TF_VAR_demo_password: ${{ secrets.DEMO_PASSWORD }}
        run: terraform apply -auto-approve -input=false

      # Deploying without confirming the new container actually serves is
      # just hoping. Fails the job if the rollout is not answering.
      - name: Verify rollout
        run: |
          for i in $(seq 1 20); do
            code=$(ssh home-server "curl -s -o /dev/null -w '%{http_code}' http://localhost:8060/healthz" || echo 000)
            if [ "$code" = "200" ]; then
              echo "deployment healthy"; exit 0
            fi
            echo "attempt $i: got $code"; sleep 3
          done
          echo "deployment did not become healthy"
          ssh home-server "docker logs --tail 50 cinejo-web" || true
          exit 1
